# Render Blueprint for the API (docs/ARCHITECTURE.md §10). New → Blueprint → this repo.
# DATABASE_URL / DIRECT_URL are entered in the dashboard (never committed).
services:
  - type: web
    name: fernleaf-api
    runtime: node
    region: singapore
    plan: free
    autoDeploy: true
    # NODE_ENV=production would make pnpm skip devDependencies (TypeScript, Prisma CLI) at build time.
    # pnpm runs through npx (pinned) because a global corepack/pnpm shim isn't guaranteed at build or
    # run time on Render; the start command needs only node and the project's own Prisma binary.
    buildCommand: npx --yes pnpm@10.34.6 install --frozen-lockfile --prod=false && npx --yes pnpm@10.34.6 turbo run build --filter=@fernleaf/api...
    startCommand: cd apps/api && ./node_modules/.bin/prisma migrate deploy && node --enable-source-maps dist/main.js
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: KITCHEN_TZ
        value: Asia/Kolkata
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_DATA_ENABLED
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
